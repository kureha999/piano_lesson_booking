name: 機能開発
description: 先生・保護者が使う機能を、モデル・画面・テストまで含めて1つのissueで作る
title: "（機能名と画面ID）"
labels: ["feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何を作るかを1〜2文で書きます。
    validations:
      required: true
  - type: input
    id: story
    attributes:
      label: ユーザーストーリー
      description: 誰が・何をしたいか・なぜか、を1文で書きます。
      placeholder: "保護者として、〜したい。なぜなら、〜からだ。"
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: やること
      description: 作業をチェックリストで書きます。
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完了条件
      description: 動作を確認できる形で書きます（テストで再現できるものが望ましい）。
      value: |
        - [ ]
    validations:
      required: true
  - type: input
    id: refs
    attributes:
      label: 関連
      description: 画面ID・機能ID・READMEの章など
      placeholder: "画面 P-02、機能 F-09、README 12-2"
  - type: dropdown
    id: points
    attributes:
      label: ストーリーポイント
      description: 1 SP ＝ 約2時間。8以上になる場合はissueを分けます。作成後、Projects の「Story Points」にも同じ値を入れてください。
      options:
        - "1"
        - "2"
        - "3"
        - "5"
    validations:
      required: true
