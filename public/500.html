<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>エラーが発生しました | ふりかえ帳</title>
    <link rel="icon" href="/icon.png" type="image/png">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        background: #fff;
        color: #212529;
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      header { background: #f8f9fa; border-bottom: 1px solid #dee2e6; padding: 0.75rem 1rem; }
      header a { color: inherit; font-size: 1.25rem; text-decoration: none; }
      main { max-width: 40rem; margin: 0 auto; padding: 3rem 1rem; text-align: center; }
      .code { color: #6c757d; font-size: 0.875rem; margin: 0; }
      h1 { font-size: 1.5rem; margin: 0.5rem 0 1rem; }
      p { margin: 0 0 1.5rem; }
      .button {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        background: #0d6efd;
        border-radius: 0.375rem;
        color: #fff;
        text-decoration: none;
      }
      .button:hover { background: #0b5ed7; }
      @media (prefers-color-scheme: dark) {
        body { background: #212529; color: #dee2e6; }
        header { background: #2b3035; border-color: #495057; }
        .code { color: #adb5bd; }
      }
    </style>
  </head>
  <body>
    <header><a href="/">ふりかえ帳</a></header>
    <main>
      <p class="code">500 Internal Server Error</p>
      <h1>エラーが発生しました</h1>
      <p>申し訳ありません。サーバーでエラーが起きました。時間をおいて、もう一度お試しください。</p>
      <a class="button" href="/">ホームに戻る</a>
    </main>
  </body>
</html>
