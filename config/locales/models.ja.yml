# モデル名・属性名の日本語訳。モデルを追加したら、ここに訳を足す。
# バリデーションのメッセージは、属性名と組み合わさって「名前を入力してください」のように表示される。
ja:
  activerecord:
    models:
      user: ユーザー
    attributes:
      user:
        email: メールアドレス
        name: 名前
        password: パスワード
        password_confirmation: パスワード（確認）
        role: 役割
        remember_me: ログインしたままにする
