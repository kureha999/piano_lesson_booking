# モデル名・属性名の日本語訳。モデルを追加したら、ここに訳を足す。
# バリデーションのメッセージは、属性名と組み合わさって「名前を入力してください」のように表示される。
ja:
  # 生徒の登録・編集フォーム（StudentForm）の項目名
  activemodel:
    attributes:
      student:
        name: 生徒の呼び名
        guardian_name: 保護者の名前
        guardian_email: 保護者のメールアドレス
  # 固定枠の登録・変更フォーム（LessonSlotForm）の項目名
      lesson_slot:
        student_id: 生徒
        wday: 曜日
        start_time: 開始時刻
        end_time: 終了時刻
        starts_on: 適用開始日
  activerecord:
    models:
      user: ユーザー
      student: 生徒
      lesson_slot: 固定枠
      makeup_slot: 振替枠
    attributes:
      student:
        name: 名前
        guardian: 保護者
      lesson_slot:
        student: 生徒
        wday: 曜日
        start_time: 開始時刻
        end_time: 終了時刻
        starts_on: 適用開始日
        ends_on: 適用終了日
      makeup_slot:
        starts_at: 開始日時
        ends_at: 終了日時
        capacity: 定員
      user:
        email: メールアドレス
        name: 名前
        password: パスワード
        password_confirmation: パスワード（確認）
        role: 役割
        remember_me: ログインしたままにする
        reset_password_token: 再設定のリンク
        invitation_token: 招待のリンク
